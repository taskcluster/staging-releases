---
# Pushes release-build artifacts to registries. Each task is idempotent: rerun a
# failed one (Rerun, not Retrigger) and the rest of the graph continues.
loader: taskgraph.loader.transform:loader

kind-dependencies:
  - release-build
  - release-gate

transforms:
  - src.transforms.release:transforms
  - src.transforms.release:toolchain
  - src.transforms.release:secret
  - src.transforms:add_task_env
  - src.transforms:parameterize_mounts
  - taskgraph.transforms.run
  - taskgraph.transforms.task

task-defaults:
  worker-type: release
  worker:
    max-run-time: 3600
  run:
    using: bare

tasks:
  push-image-monoimage:
    description: Push the monoimage to Docker Hub
    worker:
      max-run-time: 7200
    dependencies:
      gate: release-gate-builds
      build: release-build-image-monoimage
    run:
      command: yarn release:step --step push-image --name monoimage
  push-image-monoimage-devel:
    description: Push the devel monoimage to Docker Hub
    worker:
      max-run-time: 7200
    dependencies:
      gate: release-gate-builds
      build: release-build-image-monoimage-devel
    run:
      command: yarn release:step --step push-image --name monoimage-devel
  push-image-generic-worker:
    description: Push the generic-worker image to Docker Hub
    dependencies:
      gate: release-gate-builds
      build: release-build-image-generic-worker
    run:
      command: yarn release:step --step push-image --name generic-worker
  push-image-livelog:
    description: Push the livelog image to Docker Hub
    dependencies:
      gate: release-gate-builds
      build: release-build-image-livelog
    run:
      command: yarn release:step --step push-image --name livelog
  push-image-taskcluster-proxy:
    description: Push the taskcluster-proxy image to Docker Hub
    dependencies:
      gate: release-gate-builds
      build: release-build-image-taskcluster-proxy
    run:
      command: yarn release:step --step push-image --name taskcluster-proxy
  push-image-websocktunnel:
    description: Push the websocktunnel image to Docker Hub
    dependencies:
      gate: release-gate-builds
      build: release-build-image-websocktunnel
    run:
      command: yarn release:step --step push-image --name websocktunnel
  github-release-draft:
    description: Create or update the draft GitHub release and upload its assets
    dependencies:
      gate: release-gate-builds
      generic-worker: release-build-binaries-generic-worker
      worker-runner: release-build-binaries-worker-runner
      livelog: release-build-binaries-livelog
      taskcluster-proxy: release-build-binaries-taskcluster-proxy
      client-shell: release-build-binaries-client-shell
      npm-client: release-build-npm-client
      npm-client-web: release-build-npm-client-web
    worker:
      artifacts:
        - type: directory
          path: taskcluster/release-out
          name: public/build
    run:
      command: yarn release:step --step github-release-draft
  pypi:
    description: Publish the Python client to PyPI
    dependencies:
      gate: release-gate-builds
    run:
      # pypi.js runs `uv build` and `uv publish`. Keep the uv version in sync
      # with &uv_version in taskcluster/kinds/docker-image/kind.yml, and update
      # the sha256 with it. This task holds PyPI credentials and task mounts
      # cannot verify a checksum, so uv is downloaded and verified here instead.
      # Downloads land in the task directory, the parent of the checkout.
      command: >-
        curl -fsSL -o ../uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.12.8/uv-x86_64-unknown-linux-gnu.tar.gz &&
        echo "2e2b37e9811e17675a9e70bed5e1a58fc8c0388be63d751d72cc735188c149ff  ../uv.tar.gz" | sha256sum -c - &&
        tar -xzf ../uv.tar.gz -C .. &&
        export PATH="$(pwd)/../uv-x86_64-unknown-linux-gnu:$PATH" &&
        uv --version &&
        yarn release:step --step publish-pypi
  crates:
    description: Publish the Rust client crates to crates.io
    dependencies:
      gate: release-gate-builds
    run:
      command: yarn release:step --step publish-crates
